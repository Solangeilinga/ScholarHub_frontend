[build]
  command = "if [ ! -d \"_flutter_sdk\" ]; then git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter_sdk; fi && export PATH=\"$PATH:$PWD/_flutter_sdk/bin\" && flutter pub get && flutter build web --release"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200