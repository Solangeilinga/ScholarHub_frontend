<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ScholarHub — Centralisation des bourses d'études pour étudiants africains. Recherche, suivi de candidature et assistant IA.">
  <meta name="theme-color" content="#1B2FBE">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScholarHub">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ScholarHub - Bourses d'études Afrique</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #ios-install-banner {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      background: #1B2FBE;
      color: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      align-items: center;
      gap: 12px;
    }
    #ios-install-banner.visible { display: flex; }
    #ios-install-banner .icon { font-size: 22px; flex-shrink: 0; }
    #ios-install-banner .text { flex: 1; }
    #ios-install-banner .close-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="ios-install-banner">
    <span class="icon">📲</span>
    <span class="text">Installe ScholarHub : appuie sur <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</span>
    <button class="close-btn" onclick="document.getElementById('ios-install-banner').classList.remove('visible'); localStorage.setItem('sh_ios_banner_dismissed', '1');">OK</button>
  </div>
  <script>
    (function () {
      // N'affiche la bannière qu'à un vrai utilisateur iOS Safari, hors PWA
      // déjà installée, et pas s'il l'a déjà fermée une fois.
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var isStandalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var dismissed = localStorage.getItem('sh_ios_banner_dismissed') === '1';

      if (isIOS && !isStandalone && !dismissed) {
        window.addEventListener('load', function () {
          setTimeout(function () {
            var el = document.getElementById('ios-install-banner');
            if (el) el.classList.add('visible');
          }, 2500); // laisse l'app charger avant d'afficher la bannière
        });
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
