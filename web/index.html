<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ScholarHub — Centralisation des bourses d'études pour étudiants africains. Recherche, suivi de candidature et assistant IA.">
  <meta name="theme-color" content="#1B2FBE">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScholarHub">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ScholarHub - Bourses d'études Afrique</title>
  <link rel="manifest" href="manifest.json">

  <style>
    .install-banner {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      background: #1B2FBE;
      color: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      align-items: center;
      gap: 12px;
    }
    .install-banner.visible { display: flex; }
    .install-banner .icon { font-size: 22px; flex-shrink: 0; }
    .install-banner .text { flex: 1; }
    .install-banner button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      cursor: pointer;
    }
    .install-banner .install-btn { background: #fff; color: #1B2FBE; }
    .install-banner .close-btn { background: rgba(255,255,255,0.15); color: #fff; }
  </style>
</head>
<body>
  <div id="ios-install-banner" class="install-banner">
    <span class="icon">📲</span>
    <span class="text">Installe ScholarHub pour recevoir tes alertes de bourses : appuie sur <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</span>
    <button class="close-btn" onclick="document.getElementById('ios-install-banner').classList.remove('visible'); localStorage.setItem('sh_ios_banner_dismissed', '1');">OK</button>
  </div>

  <div id="android-install-banner" class="install-banner">
    <span class="icon">📲</span>
    <span class="text">Installe ScholarHub pour ne rater aucune alerte de bourse.</span>
    <button class="install-btn" id="android-install-btn">Installer</button>
    <button class="close-btn" onclick="document.getElementById('android-install-banner').classList.remove('visible'); localStorage.setItem('sh_android_banner_dismissed', '1');">✕</button>
  </div>

  <script>
    (function () {
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var isStandalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var deferredPrompt = null;

      // Capture l'événement d'installation Android dès que possible (il ne
      // se déclenche qu'une fois et tôt) — on empêche le mini-bandeau auto
      // de Chrome, mais on n'affiche PAS encore notre bannière ici : on
      // attend que Flutter nous dise que l'utilisateur vient de se connecter.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });

      window.addEventListener('appinstalled', function () {
        localStorage.setItem('sh_android_banner_dismissed', '1');
        var el = document.getElementById('android-install-banner');
        if (el) el.classList.remove('visible');
      });

      document.getElementById('android-install-btn').addEventListener('click', function () {
        var el = document.getElementById('android-install-banner');
        if (el) el.classList.remove('visible');
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
        });
      });

      // Fonction appelée depuis Dart (PwaInstallService) juste après une
      // connexion réussie. Ne fait rien si déjà installée ou déjà fermée.
      window.showScholarHubInstallBanner = function () {
        if (isStandalone) return;

        if (isIOS) {
          if (localStorage.getItem('sh_ios_banner_dismissed') === '1') return;
          var iosEl = document.getElementById('ios-install-banner');
          if (iosEl) iosEl.classList.add('visible');
        } else if (deferredPrompt) {
          if (localStorage.getItem('sh_android_banner_dismissed') === '1') return;
          var androidEl = document.getElementById('android-install-banner');
          if (androidEl) androidEl.classList.add('visible');
        }
      };
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
