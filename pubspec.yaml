name: scholarhub
description: ScholarHub - Centralisation des bourses pour étudiants africains
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.1
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3 # ⚡ NOUVEAU : Pour le cache local performant
  hive_flutter: ^1.1.0 # ⚡ NOUVEAU

  # UI & Design
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1 # ✅ Déjà présent
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  share_plus: ^12.0.1
  image_picker: ^1.0.7
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.2 # ⚡ NOUVEAU : Pour le cache

  # Performance & Background
  async: ^2.11.0 # ⚡ NOUVEAU : Pour le preloading
  background_fetch: ^1.1.5 # ⚡ NOUVEAU : Pour les mises à jour en arrière-plan (optionnel)

  # Icons
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1 # ⚡ NOUVEAU : Pour générer les adapters Hive

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
