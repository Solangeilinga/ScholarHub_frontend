name: Flutter Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build ScholarHub Web
        run: flutter build web --release

      - name: Upload PWA build
        uses: actions/upload-artifact@v4
        with:
          name: scholarhub-web-pwa
          path: build/web/
          if-no-files-found: error
          retention-days: 14
